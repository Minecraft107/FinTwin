server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API allows 2 MB CSV uploads; nginx's default limit is 1 MB. Anything bigger gets the
    # API's JSON error shape instead of nginx's HTML page.
    client_max_body_size 3m;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error": {"code": "REQUEST_ENTITY_TOO_LARGE", "message": "The file is too large (max 2 MB).", "details": {}}}';
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes (/dashboard, /goals, ...) all load the SPA.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
