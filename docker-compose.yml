# One-command startup:  docker compose up --build   ->  http://localhost:8080
# Works without a .env file; values in .env (see .env.example) override the defaults below.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintwin}
      POSTGRES_DB: ${POSTGRES_DB:-fintwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TRAIN_MODELS: ${TRAIN_MODELS:-true}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fintwin}:${POSTGRES_PASSWORD:-fintwin}@db:5432/${POSTGRES_DB:-fintwin}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
