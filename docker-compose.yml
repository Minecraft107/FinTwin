services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fintwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fintwin}
      POSTGRES_DB: ${POSTGRES_DB:-fintwin}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # backend and frontend services are added in Phase 14

volumes:
  pgdata:
